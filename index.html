<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳與清單 App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; padding: 20px; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h3 { margin-top: 0; color: #1d1d1f; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input, select { padding: 12px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 16px; -webkit-appearance: none; }
        button { background-color: #0071e3; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background-color: #005bb5; }
        .total { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #0071e3; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #f5f5f7; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .delete-btn { background: #ff3b30; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 記帳輸入區塊 -->
    <div class="card">
        <h3>💰 新增消費紀錄</h3>
        <div class="input-group">
            <input type="text" id="itemName" placeholder="項目名稱 (例如：午餐、車資)">
            <input type="number" id="itemAmount" placeholder="花費金額 (數字)" inputmode="numeric">
        </div>
        <button onclick="addItem()">記一筆</button>
    </div>

    <!-- 顯示清單區塊 -->
    <div class="card">
        <h3>📋 消費明細清單</h3>
        <div class="total" id="totalDisplay">總花費：$0</div>
        <ul id="listContainer"></ul>
    </div>

    <script>
        // 宣告一個陣列用來存放所有資料
        let records = [];

        // 1. 網頁開啟時：自動從手機抓取舊資料
        window.onload = function() {
            const savedRecords = localStorage.getItem('myExpenseRecords');
            if (savedRecords) {
                records = JSON.parse(savedRecords); // 將字串轉回陣列
                renderList(); // 渲染到畫面上
            }
        };

        // 2. 新增項目的功能
        function addItem() {
            const nameInput = document.getElementById('itemName');
            const amountInput = document.getElementById('itemAmount');

            const name = nameInput.value.trim();
            const amount = parseFloat(amountInput.value);

            // 檢查輸入是否為空
            if (name === "" || isNaN(amount)) {
                alert("請填入項目名稱與正確的金額！");
                return;
            }

            // 建立一筆新的資料物件
            const newRecord = {
                id: Date.now(), // 用時間當作唯一標籤，刪除時會用到
                name: name,
                amount: amount
            };

            records.push(newRecord); // 加進陣列
            saveToStorage();         // 自動存檔
            renderList();            // 更新畫面

            // 清空輸入框方便下一次輸入
            nameInput.value = "";
            amountInput.value = "";
        }

        // 3. 刪除項目的功能
        function deleteItem(id) {
            records = records.filter(record => record.id !== id); // 過濾掉該ID的資料
            saveToStorage(); // 自動存檔
            renderList();    // 更新畫面
        }

        // 4. 自動存檔的核心語法
        function saveToStorage() {
            localStorage.setItem('myExpenseRecords', JSON.stringify(records)); // 將陣列轉字串存入
        }

        // 5. 將陣列資料畫在手機螢幕上，並計算總金額
        function renderList() {
            const listContainer = document.getElementById('listContainer');
            const totalDisplay = document.getElementById('totalDisplay');
            
            listContainer.innerHTML = ""; // 先清空舊內容
            let total = 0;

            // 迴圈跑出每一筆資料
            records.forEach(record => {
                total += record.amount;

                const li = document.createElement('li');
                li.innerHTML = `
                    <span><strong>${record.name}</strong> : $${record.amount}</span>
                    <button class="delete-btn" onclick="deleteItem(${record.id})">刪除</button>
                `;
                listContainer.appendChild(li);
            });

            // 更新總金額顯示
            totalDisplay.innerText = `總花費：$${total}`;
        }
    </script>

</body>
</html>
